on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:
  push:
    branches:
      - main
name: latest

# Every workflow here commits *.json back to main. Runs that overlap
# (a cron tick landing next to a push-triggered run) race on the final
# push and one loses with "cannot lock ref 'refs/heads/main'". Serialise
# all of them through one repo-wide group; later runs wait, not cancel.
concurrency:
  group: push-main
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: get pipenv from cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: get pipenv dependencies from cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pipenv"

      - name: Install pipenv dependencies
        run: pipenv install

      - name: Run get_latest.py
        run: pipenv run python "scripts/get_latest.py"

      - name: Pull Remote Changes
        run: git pull
        
      - name: Auto Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Chore: latest Update"
          file_pattern: "*.json"
          repository: .
          skip_fetch: false
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
      
          
